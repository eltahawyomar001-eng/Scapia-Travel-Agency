<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>SCAPIA Admin - Content Management</title>
</head>

<body>
    <!-- DecapCMS will render here -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
        // Initialize DecapCMS with explicit config path
        if (window.CMS) {
            window.CMS.init({
                config: {
                    load_config_file: true,
                    local_backend: false
                }
            });
        }
    </script>
</body>

</html>
