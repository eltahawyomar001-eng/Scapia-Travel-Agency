<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>SCAPIA Admin - Content Management</title>
    <style>
        body { margin: 0; }
    </style>
</head>

<body>
    <script src="https://unpkg.com/netlify-cms@2.10.192/dist/netlify-cms.js"></script>
    <script>
        window.addEventListener('load', function() {
            if (typeof CMS !== 'undefined') {
                CMS.init({
                    config: {
                        backend: {
                            name: 'github',
                            repo: 'eltahawyomar001-eng/Scapia-Travel-Agency',
                            branch: 'main',
                            base_url: 'https://scapia-travel-agency.vercel.app',
                            auth_endpoint: '/api/auth'
                        },
                        media_folder: 'images/uploads',
                        public_folder: '/images/uploads',
                        site_url: 'https://scapia-travel-agency.vercel.app',
                        collections: [
                            {
                                name: 'trips',
                                label: 'Trips',
                                folder: 'content/trips',
                                create: true,
                                slug: '{{slug}}',
                                fields: [
                                    { label: 'Title', name: 'title', widget: 'string' },
                                    { label: 'Destination', name: 'destination', widget: 'string' },
                                    { label: 'Short Description', name: 'excerpt', widget: 'text' },
                                    { label: 'Full Description', name: 'description', widget: 'markdown' },
                                    { label: 'Featured Image', name: 'image', widget: 'image' },
                                    { label: 'Price', name: 'price', widget: 'number', value_type: 'int', min: 0 },
                                    { label: 'Duration', name: 'duration', widget: 'string' },
                                    { label: 'Group Size', name: 'groupSize', widget: 'string' },
                                    {
                                        label: 'Category',
                                        name: 'category',
                                        widget: 'select',
                                        options: ['family', 'adventure', 'beach', 'nature', 'cultural']
                                    },
                                    { label: 'Is Featured', name: 'featured', widget: 'boolean', default: false }
                                ]
                            },
                            {
                                name: 'settings',
                                label: 'Site Settings',
                                files: [
                                    {
                                        label: 'Homepage',
                                        name: 'homepage',
                                        file: 'content/settings/homepage.json',
                                        fields: [
                                            {
                                                label: 'Hero Section',
                                                name: 'hero',
                                                widget: 'object',
                                                fields: [
                                                    { label: 'Title', name: 'title', widget: 'string' },
                                                    { label: 'Description', name: 'description', widget: 'text' }
                                                ]
                                            }
                                        ]
                                    }
                                ]
                            }
                        ]
                    }
                });
            }
        });
    </script>
</body>

</html>
