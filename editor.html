<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCAPIA Editor - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      background: #1e293b;
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .logo h1 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .logo p {
      color: #94a3b8;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: #e2e8f0;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }
    
    input[type="password"],
    select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    
    input:focus,
    select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 24px 0;
    }
    
    .checkbox-group input {
      width: 18px;
      height: 18px;
    }
    
    .checkbox-group label {
      margin: 0;
      color: #94a3b8;
      font-weight: normal;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn-primary {
      background: #3b82f6;
      color: white;
      margin-bottom: 12px;
    }
    
    .btn-primary:hover {
      background: #2563eb;
    }
    
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    
    .btn-secondary:hover {
      background: #475569;
    }
    
    .help-text {
      text-align: center;
      margin-top: 24px;
      color: #64748b;
      font-size: 13px;
    }
    
    .help-text a {
      color: #3b82f6;
    }
    
    .page-options {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #334155;
    }
    
    .page-options h3 {
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 12px;
    }
    
    .page-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    
    .page-btn {
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      text-align: center;
    }
    
    .page-btn:hover {
      background: #1e293b;
      border-color: #3b82f6;
    }
    
    .error {
      background: #ef4444;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .success {
      background: #10b981;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>✏️ SCAPIA Editor</h1>
      <p>Visual Page Editor for your website</p>
    </div>
    
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    
    <div class="form-group">
      <label>Sanity API Token</label>
      <input type="password" id="token" placeholder="Enter your write token..." />
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="remember" checked />
      <label for="remember">Remember me on this device</label>
    </div>
    
    <button class="btn btn-primary" id="loginBtn">🔐 Login & Edit</button>
    
    <div class="page-options">
      <h3>Or go directly to a page:</h3>
      <div class="page-grid">
        <a href="index.html?edit=true" class="page-btn">🏠 Homepage</a>
        <a href="about.html?edit=true" class="page-btn">👥 About</a>
        <a href="trips.html?edit=true" class="page-btn">✈️ Trips</a>
        <a href="contact.html?edit=true" class="page-btn">📞 Contact</a>
      </div>
    </div>
    
    <p class="help-text">
      Need a token? Get it from 
      <a href="https://www.sanity.io/manage/project/klhue3lk/api#tokens" target="_blank">Sanity Dashboard</a>
    </p>
  </div>
  
  <script>
    const SANITY_PROJECT_ID = 'klhue3lk';
    const SANITY_DATASET = 'production';
    
    // Check if already logged in
    const savedToken = localStorage.getItem('scapia_editor_token');
    if (savedToken) {
      document.getElementById('success').style.display = 'block';
      document.getElementById('success').textContent = '✓ You are logged in. Choose a page to edit.';
    }
    
    document.getElementById('loginBtn').onclick = async () => {
      const token = document.getElementById('token').value.trim();
      const remember = document.getElementById('remember').checked;
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      const btn = document.getElementById('loginBtn');
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      
      if (!token) {
        errorEl.textContent = 'Please enter a token';
        errorEl.style.display = 'block';
        return;
      }
      
      btn.disabled = true;
      btn.textContent = '⏳ Verifying...';
      
      try {
        // Validate token
        const response = await fetch(
          `https://${SANITY_PROJECT_ID}.api.sanity.io/v2024-01-01/data/query/${SANITY_DATASET}?query=*[_id=="globalSettings"][0]{_id}`,
          { headers: { 'Authorization': `Bearer ${token}` } }
        );
        
        if (!response.ok) throw new Error('Invalid token');
        
        if (remember) {
          localStorage.setItem('scapia_editor_token', token);
        } else {
          sessionStorage.setItem('scapia_editor_token', token);
        }
        
        successEl.textContent = '✓ Login successful! Redirecting...';
        successEl.style.display = 'block';
        
        // Redirect to homepage in edit mode
        setTimeout(() => {
          window.location.href = 'index.html?edit=true';
        }, 1000);
        
      } catch (error) {
        errorEl.textContent = 'Invalid token. Please check and try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '🔐 Login & Edit';
      }
    };
    
    // Enter key to submit
    document.getElementById('token').onkeypress = (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    };
  </script>
</body>
</html>
